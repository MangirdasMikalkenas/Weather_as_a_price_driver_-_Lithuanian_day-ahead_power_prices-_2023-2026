# Systematic mutation testing of the engines with mutmut (README, section Tests):
#   pip install mutmut==3.8.0
#   mutmut run        # about 2 minutes; mutated copies go to mutants/
#   mutmut results    # the changes the tests did not catch; mutmut show <name> prints one
[mutmut]
source_paths = src
only_mutate =
    src/backtests.py
    src/bank_products.py
    src/exposure.py
    src/risk_engines.py
tests_dir =
    tests/test_backtests.py
    tests/test_bank_products.py
    tests/test_exposure.py
    tests/test_risk_engines.py
also_copy =
    tests
    pytest.ini
